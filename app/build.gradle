plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.ghoul.carlaunch'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ghoul.carlaunch'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }

    // 固定簽章：之後每次更新都能直接覆蓋安裝，不用先解除安裝
    signingConfigs {
        fixed {
            storeFile rootProject.file('keystore/carlaunch.jks')
            storePassword 'carlaunch'
            keyAlias 'carlaunch'
            keyPassword 'carlaunch'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
